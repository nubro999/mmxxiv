<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324.75 317.36" fill="none">
  <!-- Asset 2 — Token Architecture: heavy masses (DARK bg) -->

  <!-- large solid white disc (primary mass) -->
  <circle cx="162.375" cy="158.68" r="108" fill="#ffffff"/>

  <!-- rose arc wedge (right half) via clipped circle -->
  <path d="M 162.375 50.68 A 108 108 0 0 1 162.375 266.68 Z" fill="#ffc0cb"/>

  <!-- inner black disc (negative core) -->
  <circle cx="162.375" cy="158.68" r="46" fill="#000000"/>

  <!-- rose inner dot -->
  <circle cx="162.375" cy="158.68" r="18" fill="#ffc0cb"/>

  <!-- corner solid white blocks (anchors) -->
  <rect x="20" y="20" width="38" height="38" fill="#ffffff"/>
  <rect x="266.75" y="20" width="38" height="38" fill="#ffc0cb"/>
  <rect x="20" y="259.36" width="38" height="38" fill="#ffc0cb"/>
  <rect x="266.75" y="259.36" width="38" height="38" fill="#ffffff"/>

  <!-- thick connecting bars from corners to hub -->
  <rect x="58" y="34" width="80" height="10" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="186.75" y="34" width="80" height="10" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="58" y="273.36" width="80" height="10" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="186.75" y="273.36" width="80" height="10" fill="#ffffff" fill-opacity="0.35"/>

  <!-- vertical ash rails flanking the hub -->
  <rect x="28" y="78" width="8" height="160" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="288.75" y="78" width="8" height="160" fill="#ffffff" fill-opacity="0.55"/>
</svg>
