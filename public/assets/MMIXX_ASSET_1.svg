<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.9 288.49" fill="none">
  <!-- Asset 1 — Key Focus: heavy masses + thin linework (light bg) -->

  <!-- ───── infrastructure linework (behind masses) ───── -->

  <!-- horizontal baseline through rose center -->
  <line x1="0" y1="144" x2="344.9" y2="144" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>

  <!-- outer orbital ring around rose -->
  <circle cx="218" cy="132" r="112" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>

  <!-- outer-outer faint ring -->
  <circle cx="218" cy="132" r="130" stroke="#000000" stroke-opacity="0.12" stroke-width="0.8"/>

  <!-- ───── masses ───── -->

  <!-- ash ground block -->
  <rect x="0" y="180" width="344.9" height="108.49" fill="#f5f5f7"/>

  <!-- solid black vertical mass (left) -->
  <rect x="28" y="28" width="86" height="232" fill="#000000"/>

  <!-- solid rose disc (primary focal mass) -->
  <circle cx="218" cy="132" r="92" fill="#ffc0cb"/>

  <!-- solid black disc overlapping rose -->
  <circle cx="170" cy="180" r="44" fill="#000000"/>

  <!-- inner white circle on rose (negative space) -->
  <circle cx="218" cy="132" r="36" fill="#ffffff"/>
  <circle cx="218" cy="132" r="14" fill="#000000"/>

  <!-- thick horizontal bar bottom-right -->
  <rect x="164" y="236" width="156" height="18" fill="#000000"/>

  <!-- ash square top-right -->
  <rect x="260" y="28" width="56" height="56" fill="#f5f5f7"/>
  <circle cx="288" cy="56" r="14" fill="#ffc0cb"/>

  <!-- solid black square anchor -->
  <rect x="260" y="98" width="28" height="28" fill="#000000"/>

  <!-- ───── detail linework (on top of masses) ───── -->

  <!-- thin concentric ring inside rose -->
  <circle cx="218" cy="132" r="60" stroke="#000000" stroke-opacity="0.25" stroke-width="0.8"/>

  <!-- horizontal-only marker inside black vertical mass (white) -->
  <line x1="58" y1="140" x2="84" y2="140" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
  <circle cx="71" cy="140" r="2.2" fill="#ffffff" fill-opacity="0.7"/>

  <!-- secondary white dots in black mass -->
  <circle cx="71" cy="64" r="2.2" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="71" cy="216" r="2.2" fill="#ffffff" fill-opacity="0.5"/>

  <!-- rose orbital dot on outer ring (north) -->
  <circle cx="218" cy="20" r="4" fill="#ffc0cb"/>

  <!-- black orbital dot on outer ring (south) -->
  <circle cx="218" cy="244" r="3.5" fill="#000000"/>

  <!-- small dot cluster above ash square -->
  <g fill="#000000">
    <circle cx="268" cy="16" r="2"/>
    <circle cx="282" cy="16" r="2"/>
    <circle cx="296" cy="16" r="2"/>
    <circle cx="310" cy="16" r="2"/>
  </g>
</svg>
