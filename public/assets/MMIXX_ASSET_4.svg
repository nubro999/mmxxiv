<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267.46 285.65" fill="none">
  <!-- Asset 4 — Analysis: heavy masses + thin linework (light bg) -->

  <!-- ───── infrastructure linework (behind masses) ───── -->

  <!-- horizontal baseline through black disc center -->
  <line x1="0" y1="142" x2="267.46" y2="142" stroke="#000000" stroke-opacity="0.15" stroke-width="0.8"/>

  <!-- outer orbital ring around black disc -->
  <circle cx="96" cy="142" r="98" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>

  <!-- outer-outer faint ring -->
  <circle cx="96" cy="142" r="116" stroke="#000000" stroke-opacity="0.14" stroke-width="0.8"/>

  <!-- ───── masses ───── -->

  <!-- ash backdrop block (right) -->
  <rect x="140" y="24" width="103.46" height="237.65" fill="#f5f5f7"/>

  <!-- thin horizontal rules on ash backdrop (data grid) -->
  <g stroke="#000000" stroke-opacity="0.22" stroke-width="0.8">
    <line x1="148" y1="56" x2="236" y2="56"/>
    <line x1="148" y1="82" x2="222" y2="82"/>
    <line x1="148" y1="108" x2="236" y2="108"/>
    <line x1="148" y1="134" x2="208" y2="134"/>
  </g>

  <!-- solid black disc (primary mass) -->
  <circle cx="96" cy="142" r="82" fill="#000000"/>

  <!-- rose disc overlapping (secondary mass) -->
  <circle cx="158" cy="92" r="46" fill="#ffc0cb"/>

  <!-- horizontal solid black bars (data mass) -->
  <rect x="156" y="160" width="80" height="14" fill="#000000"/>
  <rect x="156" y="184" width="64" height="14" fill="#000000"/>
  <rect x="156" y="208" width="92" height="14" fill="#000000"/>

  <!-- solid black bottom base -->
  <rect x="24" y="246" width="219.46" height="16" fill="#000000"/>

  <!-- rose square anchor -->
  <rect x="24" y="24" width="34" height="34" fill="#ffc0cb"/>

  <!-- small black square -->
  <rect x="70" y="40" width="18" height="18" fill="#000000"/>

  <!-- ───── detail linework (on top of masses) ───── -->

  <!-- thin ring inside rose disc -->
  <circle cx="158" cy="92" r="30" stroke="#000000" stroke-opacity="0.3" stroke-width="0.8"/>

  <!-- rose nucleus dot -->
  <circle cx="158" cy="92" r="6" fill="#000000"/>

  <!-- white concentric rings inside black disc -->
  <circle cx="96" cy="142" r="58" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
  <circle cx="96" cy="142" r="34" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8"/>

  <!-- star-shaped crosshair inside black disc (white) -->
  <line x1="84" y1="142" x2="108" y2="142" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8"/>
  <line x1="96" y1="130" x2="96" y2="154" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="96" cy="142" r="2.5" fill="#ffffff" fill-opacity="0.8"/>

  <!-- dot cluster above ash backdrop -->
  <g fill="#000000">
    <circle cx="198" cy="14" r="2"/>
    <circle cx="214" cy="14" r="2"/>
    <circle cx="230" cy="14" r="2"/>
  </g>

  <!-- rose orbital dot on outer ring (north) -->
  <circle cx="96" cy="44" r="5" fill="#ffc0cb"/>

  <!-- rose orbital dot on outer ring (south) -->
  <circle cx="96" cy="240" r="4" fill="#ffc0cb"/>
</svg>
