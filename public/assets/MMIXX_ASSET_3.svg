<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.55 268" fill="none">
  <!-- Asset 3 — Stack/Growth: top-anchored massing (light bg) -->

  <!-- ash square top-left (anchor) -->
  <rect x="24" y="0" width="46" height="46" fill="#f5f5f7"/>

  <!-- rose accent strip below ash square -->
  <rect x="24" y="58" width="46" height="10" fill="#ffc0cb"/>

  <!-- solid rose disc (focal mass, top-right) -->
  <circle cx="150" cy="48" r="46" fill="#ffc0cb"/>

  <!-- black disc inside rose (depth) -->
  <circle cx="128" cy="58" r="18" fill="#000000"/>

  <!-- ascending stack of solid black bars -->
  <rect x="24" y="104" width="168" height="32" fill="#000000"/>
  <rect x="24" y="146" width="126" height="32" fill="#000000"/>
  <rect x="24" y="188" width="84" height="32" fill="#000000"/>

  <!-- ash ground block -->
  <rect x="0" y="222" width="226.55" height="46" fill="#f5f5f7"/>

  <!-- solid black foundation -->
  <rect x="0" y="254" width="226.55" height="14" fill="#000000"/>
</svg>
