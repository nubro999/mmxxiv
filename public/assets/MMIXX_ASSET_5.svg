<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 309.91 379.62" fill="none">
  <!-- Asset 5 — Liquidity: merging pools of rose + black circles (light bg) -->

  <!-- dominant rose mass (primary pool) -->
  <circle cx="178" cy="118" r="96" fill="#ffc0cb"/>

  <!-- top-right rose pool merging with dominant -->
  <circle cx="262" cy="46" r="30" fill="#ffc0cb"/>

  <!-- rose nucleus inside dominant (depth) -->
  <circle cx="222" cy="160" r="16" fill="#000000"/>

  <!-- large black mass merging with dominant bottom-left -->
  <circle cx="82" cy="228" r="64" fill="#000000"/>

  <!-- black droplet bridging the two masses -->
  <circle cx="150" cy="222" r="18" fill="#000000"/>

  <!-- mid black pool bottom-right -->
  <circle cx="238" cy="286" r="44" fill="#000000"/>

  <!-- rose pool connecting bottom, merging with mid black -->
  <circle cx="186" cy="310" r="28" fill="#ffc0cb"/>

  <!-- small black inside large black (inner current) -->
  <circle cx="104" cy="244" r="14" fill="#ffc0cb"/>

  <!-- small rose accent mid-left (free particle) -->
  <circle cx="46" cy="118" r="14" fill="#ffc0cb"/>

  <!-- tiny black accent top-center -->
  <circle cx="108" cy="44" r="8" fill="#000000"/>

  <!-- tiny rose bottom-right corner -->
  <circle cx="296" cy="348" r="10" fill="#ffc0cb"/>

  <!-- tiny black bottom-left -->
  <circle cx="34" cy="346" r="7" fill="#000000"/>

  <!-- mid rose droplet left -->
  <circle cx="70" cy="336" r="18" fill="#ffc0cb"/>
</svg>
